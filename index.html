<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAMBAN AI UNILA - MARI BELAJAR BARENG</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap');

        :root {
            --pink: #ff8fc7;
            --hot: #ff5fa8;
            --rose: #ffd1e8;
            --cream: #fff5fa;
            --berry: #b8326f;
            --text: #7a2150;
            --mint: #6fe3b5;
            --sky: #8fd3ff;
            --lilac: #c9a8ff;
            --butter: #ffe08a;
            --red: #ff4d7d;
            --border: #ffb3d9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--cream);
            color: var(--text);
            font-family: 'Baloo 2', 'Comic Sans MS', 'Trebuchet MS', sans-serif;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            height: 100vh;
            background-image:
                radial-gradient(circle at center, #fff 0%, #ffe3f1 100%),
                radial-gradient(var(--rose) 3px, transparent 3.5px);
            background-size: 100% 100%, 34px 34px;
        }

        /* --- Boot Screen --- */
        #boot-screen {
            position: fixed; inset: 0;
            background: rgba(255, 228, 242, 0.96); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: opacity 0.5s ease;
        }
        #boot-screen h1 { font-size: 2.2em; font-weight: 800; color: var(--hot); text-align: center; padding: 0 20px; text-shadow: 3px 3px 0 #fff; }
        #boot-screen p { margin-top: 12px; color: var(--berry); text-align: center; padding: 0 20px; }
        @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-12px) scale(1.05); } }

        .hud-container { width: 95%; height: 95%; position: relative; }
        .panel {
            background: #fff; border: 3px solid var(--border);
            padding: 16px 20px; position: absolute; border-radius: 28px;
            box-shadow: 0 8px 0 var(--rose);
        }
        .panel-left { top: 20px; left: 20px; width: 300px; }
        .panel-right { top: 20px; right: 20px; width: 300px; text-align: right; }

        @media (max-width: 768px) {
            .panel-left, .panel-right { width: 46%; padding: 10px 12px; font-size: 0.75em; border-radius: 20px; }
            .panel-left { top: 10px; left: 10px; }
            .panel-right { top: 10px; right: 10px; }
            .jarvis-core-container { transform: translate(-50%, -55%) scale(0.75); }
        }

        .panel-title { font-size: 1.1em; font-weight: 800; margin-bottom: 8px; color: var(--hot); }
        .data-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; font-size: 0.95em; font-weight: 500; }

        /* --- CUTE BLOB CORE --- */
        .jarvis-core-container {
            position: absolute; top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            width: 400px; height: 400px;
            display: flex; justify-content: center; align-items: center;
            perspective: 800px;
        }

        .solar-flare-cloud {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d;
            animation: spin-cloud 25s linear infinite;
            z-index: 15; pointer-events: none;
        }

        .solar-particle {
            position: absolute; top: 50%; left: 50%;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--pink);
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(255, 95, 168, 0.4);
            transition: transform 0.1s ease-out, background 0.3s;
        }

        .core-orb {
            width: 170px; height: 150px; border-radius: 50% 50% 48% 48% / 55% 55% 45% 45%;
            background: radial-gradient(circle at 35% 30%, #fff 0%, var(--rose) 25%, var(--pink) 100%);
            border: 4px solid #fff;
            box-shadow: 0 10px 0 var(--hot), 0 18px 40px rgba(255, 95, 168, 0.45);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 20; position: relative; transition: transform 0.1s ease;
            animation: wobble 3s infinite ease-in-out;
        }

        .eyes { display: flex; gap: 46px; margin-top: -4px; }
        .eye { width: 16px; height: 22px; background: var(--text); border-radius: 50%; position: relative; animation: blink-eye 4s infinite; }
        .eye::after { content: ''; position: absolute; top: 4px; left: 4px; width: 6px; height: 6px; background: #fff; border-radius: 50%; }
        .mouth { width: 16px; height: 9px; border: 3px solid var(--text); border-top: none; border-radius: 0 0 20px 20px; margin-top: 4px; }
        .core-text { font-size: 15px; font-weight: 800; letter-spacing: 2px; color: var(--berry); margin-top: 4px; }

        @keyframes wobble {
            0%, 100% { transform: scale(1, 1) translateY(0); }
            50% { transform: scale(1.05, 0.96) translateY(4px); }
        }
        @keyframes blink-eye { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }

        .ring-solar {
            position: absolute; width: 300px; height: 300px;
            border-radius: 50%; border: 4px dotted var(--pink);
            transform: rotateX(70deg); animation: spin-3d 15s linear infinite;
        }
        .ring-outer {
            position: absolute; width: 360px; height: 360px;
            border-radius: 50%; border: 3px dashed var(--border);
            animation: spin-slow 20s linear infinite;
        }

        @keyframes spin-cloud { 0% { transform: rotateY(0deg) rotateX(20deg); } 100% { transform: rotateY(360deg) rotateX(20deg); } }
        @keyframes spin-3d { 100% { transform: rotateX(70deg) rotateZ(360deg); } }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }

        .state-listening .core-orb { background: radial-gradient(circle at 35% 30%, #fff 0%, #d4fff0 25%, var(--mint) 100%); box-shadow: 0 10px 0 #35c48f, 0 18px 40px rgba(111, 227, 181, 0.6); }
        .state-listening .mouth { width: 14px; height: 14px; border: 3px solid var(--text); border-radius: 50%; }
        .state-thinking .core-orb { background: radial-gradient(circle at 35% 30%, #fff 0%, #e6f5ff 25%, var(--sky) 100%); box-shadow: 0 10px 0 #4fb2ee, 0 18px 40px rgba(143, 211, 255, 0.6); animation: pulse-fast 0.5s infinite alternate; }
        @keyframes pulse-fast { 0% { transform: scale(0.94); } 100% { transform: scale(1.1); } }

        /* --- TALK BUTTON --- */
        .talk-btn {
            position: absolute; bottom: 195px; left: 50%;
            transform: translateX(-50%);
            background: var(--hot); border: 4px solid #fff;
            color: #fff; padding: 12px 34px; font-family: inherit;
            font-size: 1.15em; font-weight: 800; cursor: pointer;
            box-shadow: 0 6px 0 var(--berry), 0 12px 25px rgba(255, 95, 168, 0.4);
            transition: all 0.15s; z-index: 50; border-radius: 40px;
        }
        .talk-btn:hover { background: var(--pink); transform: translateX(-50%) translateY(-2px); }
        .talk-btn:active, .talk-btn.recording { background: var(--mint); color: #1c5c44; box-shadow: 0 6px 0 #35c48f; transform: translateX(-50%) translateY(3px) scale(0.97); }
        .talk-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .talk-btn:focus-visible, .interrupt-btn:focus-visible { outline: 4px solid var(--lilac); outline-offset: 3px; }

        /* --- Text Area --- */
        .text-output-container {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 900px; height: 150px;
            background: #fff; border: 3px solid var(--border);
            padding: 12px 22px; box-shadow: 0 8px 0 var(--rose); display: flex; flex-direction: column; z-index: 20; border-radius: 30px;
        }
        @media (max-width: 768px) {
            .text-output-container { height: 130px; bottom: 14px; width: 95%; padding: 10px 16px; }
            .response-text { font-size: 0.95em !important; }
            .talk-btn { bottom: 160px; padding: 10px 22px; font-size: 1em; }
        }

        .status-header { font-size: 0.9em; font-weight: 700; color: var(--hot); margin-bottom: 4px; display: flex; justify-content: space-between; }
        .status-header span:last-child { animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .response-text { flex-grow: 1; overflow-y: auto; font-size: 1.1em; line-height: 1.4; padding-right: 10px; color: var(--text); }
        .response-text::-webkit-scrollbar { width: 8px; }
        .response-text::-webkit-scrollbar-track { background: var(--cream); border-radius: 8px; }
        .response-text::-webkit-scrollbar-thumb { background: var(--pink); border-radius: 8px; }

        /* --- INTERRUPT BUTTON --- */
        .interrupt-btn {
            position: absolute; bottom: 195px; right: 20px;
            background: var(--red); border: 4px solid #fff;
            color: #fff; padding: 10px 16px; font-family: inherit;
            font-size: 0.9em; font-weight: 800; cursor: pointer;
            box-shadow: 0 5px 0 #b3264f;
            transition: all 0.15s; z-index: 50; display: none; border-radius: 30px;
        }
        @media (max-width: 768px) { .interrupt-btn { bottom: 160px; right: 10px; padding: 8px 12px; } }
        .interrupt-btn:hover { transform: translateY(-2px); }

        #tts-debug { position: absolute; bottom: -8px; right: 12px; font-size: 0.7em; color: #c98aa9; z-index: 99; }

        @media (prefers-reduced-motion: reduce) {
            .solar-flare-cloud, .ring-solar, .ring-outer, .core-orb, #boot-screen h1 { animation: none; }
        }
    </style>
</head>
<body>
    <div id="boot-screen">
        <h1>LAMBAN AI UNILA</h1>
        <p>Sentuh layar untuk memulai dan mengaktifkan suara</p>
    </div>

    <div class="hud-container">
        <!-- Panels -->
        <div class="panel panel-left">
            <div class="panel-title">Diagnostik</div>
            <div class="data-row"><span>Mode:</span> <span style="color:var(--hot)">Tekan &amp; Bicara</span></div>
            <div class="data-row"><span>Mic:</span> <span id="mic-status" style="color:var(--hot)">READY</span></div>
            <div class="data-row"><span>Beban:</span> <span id="cpu" style="color:#35c48f">14.2%</span></div>
        </div>
        <div class="panel panel-right">
            <div class="panel-title">Status AI</div>
            <div class="data-row"><span>Reaktor:</span> <span style="color:#35c48f">Stabil</span></div>
            <div class="data-row"><span>Kluster:</span> <span style="color:var(--hot)">LAMBAN-AI</span></div>
        </div>

        <!-- CUTE BLOB CORE -->
        <div class="jarvis-core-container" id="core-visualizer">
            <div class="ring-outer"></div>
            <div class="ring-solar"></div>
            <div class="solar-flare-cloud" id="solar-cloud"></div>
            <div class="core-orb" id="core-orb">
                <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
                <div class="mouth"></div>
                <span class="core-text">.UNILA.</span>
            </div>
        </div>

        <!-- Tombol Interaksi Manual -->
        <button class="talk-btn" id="talk-btn">🎙️ TEKAN UNTUK BICARA</button>
        <button class="interrupt-btn" id="interrupt-btn">⏹️ STOP AI</button>

        <!-- Text Output -->
        <div class="text-output-container">
            <div class="status-header">
                <span id="ai-status">SIAGA</span>
                <span>_</span>
            </div>
            <div class="response-text" id="ai-response">
                Tekan tombol 'Tekan Untuk Bicara' di atas untuk mulai berbicara dengan LAMBAN AI.
            </div>
        </div>

        <div id="tts-debug">[ TTS: STANDBY ]</div>
    </div>

    <script>
        const bootScreen = document.getElementById('boot-screen');
        const aiResponse = document.getElementById('ai-response');
        const aiStatus = document.getElementById('ai-status');
        const micStatus = document.getElementById('mic-status');
        const talkBtn = document.getElementById('talk-btn');
        const interruptBtn = document.getElementById('interrupt-btn');
        const ttsDebug = document.getElementById('tts-debug');

        const coreVisualizer = document.getElementById('core-visualizer');
        const solarCloud = document.getElementById('solar-cloud');
        const coreOrb = document.getElementById('core-orb');

        let isSystemActive = false;
        let isAiSpeaking = false;
        let currentState = 'STANDBY';

        const STATE_LABEL = {
            STANDBY: 'SIAGA',
            LISTENING: 'MENDENGARKAN',
            THINKING: 'MEMPROSES',
            RESPONDING: 'MENJAWAB'
        };

        // --- SESSION ID GENERATOR UNTUK MULTI-USER ---
        function getSessionId() {
            let sessionId = sessionStorage.getItem('lamban_session_id');
            if (!sessionId) {
                sessionId = 'user_' + Math.random().toString(36).substring(2, 9) + '_' + Date.now();
                sessionStorage.setItem('lamban_session_id', sessionId);
            }
            return sessionId;
        }

        // --- 1. GENERATE PARTIKEL GELEMBUNG PINK ---
        const numParticles = 60;
        const particles = [];
        const PINKS = ['var(--pink)', 'var(--rose)', 'var(--lilac)', 'var(--butter)', 'var(--sky)'];

        for (let i = 0; i < numParticles; i++) {
            const p = document.createElement('div');
            p.className = 'solar-particle';
            const theta = Math.random() * 2 * Math.PI;
            const phi = Math.acos(Math.random() * 2 - 1);
            const radius = 100 + Math.random() * 85;

            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.sin(phi) * Math.sin(theta);
            const z = radius * Math.cos(phi);

            const color = PINKS[i % PINKS.length];
            p.style.background = color;
            p.style.transform = `translate3d(${x}px, ${y}px,${z}px)`;
            solarCloud.appendChild(p);
            particles.push({ el: p, base_x: x, base_y: y, base_z: z, radius: radius, color: color });
        }

        // --- 2. ANIMATION CORE ---
        function animateSolarCore() {
            requestAnimationFrame(animateSolarCore);

            let time = Date.now() / 150;
            let sum = 0;

            if (currentState === 'LISTENING') {
                let wave = Math.abs(Math.sin(time * 1.5));
                let scale = 1 + (wave * 0.12);
                coreOrb.style.transform = `scale(${Math.min(scale, 1.2)})`;

                particles.forEach((p, index) => {
                    let pWave = Math.abs(Math.sin(time + (index * 0.1)));
                    let expand = 1 + (pWave * 0.4);
                    p.el.style.transform = `translate3d(${p.base_x * expand}px,${p.base_y * expand}px, ${p.base_z * expand}px) scale(${expand})`;
                    p.el.style.background = pWave > 0.6 ? '#fff' : 'var(--mint)';
                });
            } else if (currentState === 'RESPONDING' || currentState === 'THINKING') {
                particles.forEach((p, index) => {
                    let wave = Math.abs(Math.sin(time + (index * 0.1)));
                    let expand = 1 + (wave * 0.5);
                    p.el.style.transform = `translate3d(${p.base_x * expand}px,${p.base_y * expand}px, ${p.base_z * expand}px) scale(${1 + wave * 0.6})`;
                    p.el.style.background = wave > 0.7 ? '#fff' : (currentState === 'THINKING' ? 'var(--sky)' : p.color);
                    sum += wave;
                });
                if (currentState === 'RESPONDING') coreOrb.style.transform = `scale(${1 + (sum / numParticles * 0.2)})`;
            } else {
                particles.forEach(p => {
                    p.el.style.transform = `translate3d(${p.base_x}px, ${p.base_y}px,${p.base_z}px) scale(1)`;
                    p.el.style.background = p.color;
                });
                coreOrb.style.transform = '';
            }
        }
        animateSolarCore();

        // --- 3. SPEECH RECOGNITION ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'id-ID';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        // --- 4. TUNING SUARA (SMOOTH SETTINGS) ---
        const synth = window.speechSynthesis;
        let cachedVoices = [];

        function loadVoices() {
            cachedVoices = synth.getVoices();
        }
        loadVoices();
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function getBestVoice() {
            const voices = cachedVoices.length ? cachedVoices : synth.getVoices();
            let premiumVoice = voices.find(v => v.lang.includes('id') && (v.name.includes('Online') || v.name.includes('Wavenet') || v.name.includes('Natural') || v.name.includes('Google')));
            if (premiumVoice) return premiumVoice;

            let femaleVoice = voices.find(v => v.lang.includes('id') && (v.name.includes('Female') || v.name.includes('Gadis')));
            if (femaleVoice) return femaleVoice;

            return voices.find(v => v.lang.includes('id')) || voices[0];
        }

        function updateState(state) {
            currentState = state;
            aiStatus.innerText = STATE_LABEL[state] || state;
            coreVisualizer.className = 'jarvis-core-container';

            if (state === 'LISTENING') {
                coreVisualizer.classList.add('state-listening');
                micStatus.innerText = "MEREKAM";
                micStatus.style.color = "#35c48f";
                talkBtn.innerText = "🔴 MENDENGARKAN...";
                talkBtn.classList.add('recording');
                talkBtn.disabled = false;
                interruptBtn.style.display = "none";
            } else if (state === 'THINKING') {
                coreVisualizer.classList.add('state-thinking');
                micStatus.innerText = "SYNC";
                micStatus.style.color = "#4fb2ee";
                talkBtn.innerText = "⏳ MEMPROSES...";
                talkBtn.classList.remove('recording');
                talkBtn.disabled = true;
                interruptBtn.style.display = "none";
            } else if (state === 'RESPONDING') {
                talkBtn.innerText = "🎙️ TEKAN UNTUK BICARA";
                talkBtn.classList.remove('recording');
                talkBtn.disabled = false;
                interruptBtn.style.display = "block";
            } else {
                micStatus.innerText = "READY";
                micStatus.style.color = "var(--hot)";
                talkBtn.innerText = "🎙️ TEKAN UNTUK BICARA";
                talkBtn.classList.remove('recording');
                talkBtn.disabled = false;
                interruptBtn.style.display = "none";
            }
        }

        // --- PUSH-TO-TALK EVENTS ---
        talkBtn.addEventListener('click', () => {
            if (!isSystemActive || currentState === 'THINKING') return;

            if (isAiSpeaking) {
                synth.cancel();
                isAiSpeaking = false;
            }
            try {
                recognition.stop();
                setTimeout(() => { recognition.start(); updateState('LISTENING'); }, 100);
            } catch(e) { console.log(e); }
        });

        interruptBtn.addEventListener('click', () => {
            if (isAiSpeaking) {
                synth.cancel();
                isAiSpeaking = false;
                ttsDebug.innerText = "[ TTS: DIHENTIKAN ]";
                updateState('STANDBY');
            }
        });

        // --- BOOT SISTEM ---
        bootScreen.addEventListener('click', () => {
            bootScreen.style.opacity = '0';
            setTimeout(() => { bootScreen.style.display = 'none'; }, 500);

            isSystemActive = true;
            synth.resume();
            synth.cancel();

            const unlockAudio = new SpeechSynthesisUtterance('LAMBAN BELAJAR siap.');
            const voice = getBestVoice();
            if (voice) unlockAudio.voice = voice;

            unlockAudio.pitch = 1.0;
            unlockAudio.rate = 0.9;
            unlockAudio.volume = 1;
            synth.speak(unlockAudio);

            aiResponse.innerHTML = "<span style='color:var(--hot)'>Sistem LAMBAN.AI aktif. Session ID: " + getSessionId() + "</span>";
            updateState('STANDBY');
        });

        // --- KIRIM SUARA KE N8N ---
        recognition.onresult = async (event) => {
            const transcript = event.results[0][0].transcript;
            updateState('THINKING');
            aiResponse.innerHTML = `<span style="color:var(--berry)">Kamu:</span> ${transcript}<br><br><span style="color:var(--sky); font-weight:700;">Memproses pertanyaan...</span>`;

            try {
                const n8nWebhookUrl = 'http://localhost:5678/webhook/jarvis-chat';

                const response = await fetch(n8nWebhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: transcript,
                        chatInput: transcript,
                        session_id: getSessionId()
                    })
                });

                if (!response.ok) throw new Error("Gagal menghubungi server kluster.");

                const data = await response.json();
                let aiText = data.reply || data.output || "Reaktor tidak memberikan respons.";

                const cleanText = aiText.replace(/[*#_`~()><\-]/g, ' ');

                updateState('RESPONDING');
                aiResponse.innerHTML = `<span style="color:var(--berry)">Kamu:</span> ${transcript}<br><br><span style="color:var(--hot); font-weight:700;">LAMBAN-AI:</span><br>${cleanText.replace(/\n/g, '<br>')}`;
                aiResponse.scrollTop = aiResponse.scrollHeight;

                speakText(cleanText);

            } catch (error) {
                aiResponse.innerHTML += `<br><br><span style="color:var(--red)">Error: ${error.message}</span>`;
                updateState('STANDBY');
            }
        };

        recognition.onerror = (event) => {
            console.error("Speech Rec error:", event.error);
            updateState('STANDBY');
        };

        // --- PEMBACA SUARA (SMOOTH TUNING) ---
        function speakText(text) {
            isAiSpeaking = true;
            synth.resume();
            synth.cancel();

            const chunks = text.match(/[^.!?]+[.!?]+|\s*[^.!?]+$/g) || [text];
            let index = 0;

            function speakNextChunk() {
                if (index >= chunks.length) {
                    isAiSpeaking = false;
                    ttsDebug.innerText = "[ TTS: SELESAI ]";
                    updateState('STANDBY');
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(chunks[index]);
                const voice = getBestVoice();
                if (voice) utterance.voice = voice;

                utterance.pitch = 1.0;
                utterance.rate = 0.9;
                utterance.volume = 1;

                utterance.onstart = () => {
                    ttsDebug.innerText = `[ TTS: ${index+1}/${chunks.length} ]`;
                    ttsDebug.style.color = "#35c48f";
                };

                utterance.onend = () => { index++; speakNextChunk(); };
                utterance.onerror = () => { index++; speakNextChunk(); };

                synth.speak(utterance);
            }
            speakNextChunk();
        }

        setInterval(() => {
            if(isSystemActive) {
                const cpuEl = document.getElementById('cpu');
                if (cpuEl) cpuEl.innerText = (Math.random() * 5 + 12).toFixed(1) + '%';
            }
        }, 1000);
    </script>
</body>
</html>
